# DISABLED: Hostinger Git Integration handles auto-deployment
# This workflow is no longer needed and has been disabled to prevent conflicts
# If Hostinger autodeploy fails, you can re-enable this by uncommenting the workflow below

name: Deploy to Breveasy.com

# Workflow disabled - Hostinger handles deployment automatically
on:
  workflow_dispatch: # Only allow manual trigger, no automatic runs
  # push:
  #   branches:
  #     - main

jobs:
  deploy:
    name: Deploy to Breveasy.com (DISABLED)
    runs-on: ubuntu-latest
    if: false  # This prevents the job from running
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.BREVEASY_HOST }}
          username: ${{ secrets.BREVEASY_USER }}
          key: ${{ secrets.BREVEASY_SSH_KEY }}
          port: ${{ secrets.BREVEASY_PORT }}
          script: |
            cd ${{ secrets.BREVEASY_PATH }}
            git fetch origin
            git reset --hard origin/main
            git clean -fd
            echo "Deployment completed at $(date)"

