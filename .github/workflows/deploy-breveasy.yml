name: Deploy to Breveasy.com

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    name: Deploy to Breveasy.com
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.BREVEASY_HOST }}
          username: ${{ secrets.BREVEASY_USER }}
          key: ${{ secrets.BREVEASY_SSH_KEY }}
          port: ${{ secrets.BREVEASY_PORT }}
          script: |
            cd ${{ secrets.BREVEASY_PATH }}
            git fetch origin
            git reset --hard origin/main
            git clean -fd
            echo "Deployment completed at $(date)"

