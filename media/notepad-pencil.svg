<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Calendar base (same as Jump to Date) -->
  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
  <line x1="16" y1="2" x2="16" y2="6"/>
  <line x1="8" y1="2" x2="8" y2="6"/>
  <line x1="3" y1="10" x2="21" y2="10"/>
  
  <!-- Pencil overlay (angled) -->
  <g transform="translate(12, 14) rotate(45)">
    <!-- Pencil shaft -->
    <rect x="-1" y="0" width="2" height="8" fill="currentColor"/>
    <!-- Pencil tip -->
    <polygon points="0,-1.5 -0.6,0 0.6,0" fill="currentColor"/>
    <!-- Pencil eraser -->
    <circle cx="0" cy="9" r="1" fill="currentColor" opacity="0.7"/>
  </g>
</svg>
