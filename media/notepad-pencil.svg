<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
  <!-- Notepad background -->
  <rect x="4" y="2" width="12" height="18" rx="1" ry="1" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
  
  <!-- Notepad lines -->
  <line x1="6" y1="6" x2="14" y2="6" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  <line x1="6" y1="9" x2="14" y2="9" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  <line x1="6" y1="12" x2="14" y2="12" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  <line x1="6" y1="15" x2="12" y2="15" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  
  <!-- Pencil -->
  <g transform="translate(12, 8) rotate(45)">
    <!-- Pencil shaft -->
    <rect x="-1.5" y="0" width="3" height="12" fill="currentColor"/>
    <!-- Pencil tip (eraser) -->
    <circle cx="0" cy="14" r="1.5" fill="currentColor" opacity="0.6"/>
    <!-- Pencil point -->
    <polygon points="0,-2 -0.8,0 0.8,0" fill="currentColor"/>
  </g>
</svg>
